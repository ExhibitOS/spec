name: Check synthetic fixtures
on:
  workflow_dispatch:
concurrency:
  group: synthetic-fixtures-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run check
